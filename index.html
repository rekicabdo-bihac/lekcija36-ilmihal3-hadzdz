<!doctype html><html lang="bs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Hadž – Ilmihal 3</title><script async src="https://www.googletagmanager.com/gtag/js?id=G-4WRS80K94M"></script><script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments)}gtag('js',new Date());gtag('config','G-4WRS80K94M');</script><style>body{margin:0;background:#f3ead6;color:#222;font-family:system-ui,Arial}header{background:#265d50;color:white;padding:12px;text-align:center}main{max-width:850px;margin:auto;padding:12px}nav{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}button{border:0;border-radius:10px;background:#286d5b;color:white;padding:12px;font-size:16px;cursor:pointer}button:disabled{opacity:.5}.card{background:#fff9ed;border:1px solid #d4b98b;border-radius:15px;padding:18px;margin:12px 0;box-shadow:0 2px 7px #0001}.option{display:block;width:100%;margin:8px 0;text-align:left;background:#e5dbc6;color:#222}.option.good{background:#9be0ac}.option.bad{background:#ffb3aa}.hide{display:none}h1{font-size:1.5rem}h2{font-size:1.2rem}.muted{color:#625e55}.big{font-size:1.35rem;min-height:110px;display:grid;place-items:center;text-align:center}.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tile{min-height:64px;background:#e6d6b5;color:#222}.tile.sel{outline:4px solid #2a7}.tile.done{opacity:.35}.memory{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.memory button{min-height:70px;background:#d5b989;color:#1c211e;font-size:14px}.memory button.open{background:#fff8e8}.memory button.done{opacity:.25}footer{text-align:center;padding:15px}a{color:#265d50}@media(max-width:500px){.memory{grid-template-columns:repeat(3,1fr)}.pair{grid-template-columns:1fr}button{font-size:15px}}</style></head><body><header><h1>Hadž – propisi i odlike hadža</h1><small>Ilmihal 3 • Stranice 80–82 • Pripremio Abdo ef. Rekić</small></header><main><nav><button onclick="show('lesson')">Lekcija</button><button onclick="show('cards')">Kartice</button><button onclick="startQuiz()">Kviz (30)</button><button onclick="startPairs()">Spoji parove</button><button onclick="startMemory()">Memori</button><button onclick="full()">Cijeli ekran</button></nav><section id="lesson"></section><section id="cards" class="hide"><div class="card"><div id="cardCount"></div><div id="flash" class="big" onclick="flip()"></div><nav><button onclick="prevCard()">Prethodna</button><button onclick="flip()">Okreni</button><button onclick="nextCard()">Sljedeća</button></nav></div></section><section id="quiz" class="hide"><div class="card"><div id="progress"></div><h2 id="question"></h2><div id="answers"></div><p id="score"></p></div></section><section id="pairs" class="hide"><div class="card"><h2>Spoji pitanje i odgovor</h2><p>Pronađi 6 odgovarajućih parova.</p><div id="pairArea" class="pair"></div><p id="pairStatus"></p><button onclick="startPairs()">Nova postava</button></div></section><section id="memory" class="hide"><div class="card"><h2>Memori</h2><p>Pronađi 6 parova.</p><div id="memoryArea" class="memory"></div><p id="memoryStatus"></p><button onclick="startMemory()">Nova postava</button></div></section></main><footer><a href="https://rekicabdo-bihac.github.io/mektebski-portal/">Digitalni mektebski centar</a></footer><script>
const data=[{"q": "Šta je hadž?", "options": ["Ibadet posjete Kabi i drugim svetim mjestima u propisanom vremenu.", "Posjeta Medini u bilo kojem mjesecu.", "Obilazak Kabe bez drugih obreda u bilo kojem vremenu.", "Dobrovoljni namaz u Mekki."], "answer": 0}, {"q": "Koji je hadž po redu islamski šart?", "options": ["Peti.", "Treći.", "Četvrti.", "Drugi."], "answer": 0}, {"q": "Koliko puta u životu je hadž obavezan osobi koja ispunjava uvjete?", "options": ["Jednom.", "Svake godine.", "Dva puta.", "Svakog ramazana."], "answer": 0}, {"q": "Koji je uvjet u vezi s dobi i zdravljem?", "options": ["Punoljetnost te fizička i mentalna sposobnost.", "Samo punoljetnost bez obzira na sposobnost.", "Samo fizička snaga bez obzira na dob.", "Isključivo dobro pamćenje."], "answer": 0}, {"q": "Šta podrazumijeva materijalna mogućnost za hadž?", "options": ["Sredstva za put i povratak te opskrbu porodice do povratka.", "Samo novac za odlazak u Mekku.", "Samo sredstva za kupovinu ihrama.", "Samo novac za boravak na Mini."], "answer": 0}, {"q": "Šta znači uvjet sigurnosti puta?", "options": ["Sigurnost života i imetka tokom putovanja.", "Da put traje što kraće.", "Da se putuje samo danju.", "Da je prijevoz besplatan."], "answer": 0}, {"q": "Koji dodatni uvjet za ženu  za hadzdz?", "options": ["Prisustvo mahrema na putovanju.", "Da putuje isključivo sama.", "Da je već obavila umru.", "Da ima vlastiti automobil."], "answer": 0}, {"q": "Ko može biti mahrem ?", "options": ["Otac, djed ili brat.", "Bilo koji poznanik.", "Svaki saputnik iz grupe.", "Bilo koji trgovac."], "answer": 0}, {"q": "Gdje hadžije oblače ihrame ?", "options": ["U blizini Mekke, na mikatima.", "Na Arefatu poslije podne.", "Na Mini nakon bacanja kamenčića.", "Na Muzdelifi nakon sabaha."], "answer": 0}, {"q": "Od čega se sastoji muški ihram?", "options": ["Od dva bijela nešivena platna.", "Od jedne sašivene bijele košulje.", "Od tri vunena ogrtača.", "Od bijelog odijela i kape."], "answer": 0}, {"q": "Kako je opisan ihram žene?", "options": ["Uobičajena nošnja – hidžab.", "Dva nešivena platna kao kod muškarca.", "Odjeća bez pokrivene kose.", "Posebna hadžska odjeća."], "answer": 0}, {"q": "Šta je lijepo učiniti prije oblačenja ihrama?", "options": ["Okupati se i namirisati.", "Obaviti oproštajni tavaf.", "Baciti kamenčiće.", "Obaviti sa’j."], "answer": 0}, {"q": "Šta hadžije čine nakon oblačenja ihrama?", "options": ["Klanjaju dva rekata i uče telbijju.", "Odmah obavljaju oproštajni tavaf.", "Odmah završavaju hadž.", "Klanjaju bajram-namaz."], "answer": 0}, {"q": "Kako se nazivaju hadžije nakon stupanja u ihramsko stanje?", "options": ["Muhrimi.", "Mujezini.", "Muktedije.", "Musafiri samo u Mekki."], "answer": 0}, {"q": "Koja je zabrana tokom ihrama ?", "options": ["Svađa i prepirka.", "Učenje telbijje.", "Obavljanje namaza.", "Boravak na Arefatu."], "answer": 0}, {"q": "Koja je zabrana u vezi s mirisima tokom ihrama?", "options": ["Korištenje mirisnih sapuna i šampona prilikom kupanja.", "Koristenje vode bez sapuna za kupanje.", "Pranje ruku vodom.", "Nošenje čiste odjeće izvan ihrama."], "answer": 0}, {"q": "Šta je muškarcima zabranjeno tokom ihrama?", "options": ["Pokrivanje glave.", "Učenje Kur’ana.", "Klanjanje namaza.", "Izgovaranje telbijje."], "answer": 0}, {"q": "Šta je ženama zabranjeno tokom ihrama ?", "options": ["Pokrivanje lica.", "Nošenje hidžaba.", "Učenje dove.", "Prisustvovanje obredima."], "answer": 0}, {"q": "Šta je zabranjeno raditi s noktima i kosom u ihramu?", "options": ["Rezati nokte i brijati ili šišati kosu.", "Prati ruke običnom vodom.", "Češljati se bez čupanja kose.", "Prati kosu."], "answer": 0}, {"q": "Kojeg dana zul-hidžeta hadžije borave na Arefatu?", "options": ["Devetog.", "Sedmog.", "Desetog.", "Dvanaestog."], "answer": 0}, {"q": "Kako glasi izreka Poslanika, a.s., o  hadždžu?", "options": ["Hadž je Arefat.", "Hadž je samo tavaf.", "Hadž je samo sa’j.", "Hadž je samo Mina."], "answer": 0}, {"q": "Koje namaze hadžije spajaju na Arefatu u podnevskom vremenu?", "options": ["Podne i ikindiju.", "Akšam i jaciju.", "Sabah i podne.", "Ikindiju i akšam."], "answer": 0}, {"q": "Gdje hadžije odlaze nakon zalaska Sunca na Arefatu?", "options": ["Na Muzdelifu.", "Direktno u Medinu.", "Na Safu.", "Na mikat."], "answer": 0}, {"q": "Koje namaze hadžije klanjaju na Muzdelifi ?", "options": ["Akšam i jaciju spojeno.", "Sabah i podne spojeno.", "Podne i ikindiju spojeno.", "Ikindiju i akšam spojeno."], "answer": 0}, {"q": "Šta hadžije sakupljaju na Muzdelifi?", "options": ["Kamenčiće za obred na Mini.", "Vodu za tavaf.", "Platna za ihram.", "Grane za šatore."], "answer": 0}, {"q": "Gdje hadžije odlaze nakon sabaha desetog zul-hidžeta?", "options": ["Na Veliko džemre.", "Na mikat.", "Na Safu.", "Na Arefat ponovo."], "answer": 0}, {"q": "Šta je tavaf?", "options": ["Sedam obilazaka oko Kabe.", "Sedam prolazaka između Safe i Merve.", "Sedam bacanja kamenčića na Arefatu.", "Sedam namaza na Mini."], "answer": 0}, {"q": "Odakle započinje tavaf?", "options": ["Od Hadžerul-esveda.", "Od brda Arefat.", "Od džemreta na Mini.", "Od izvora Zemzem."], "answer": 0}, {"q": "Šta je sa’j?", "options": ["Ubrzani hod između Safe i Merve.", "Obilazak Kabe sedam puta.", "Boravak na Arefatu.", "Bacanje kamenčića na džemretima."], "answer": 0}, {"q": "Šta je umra prema lekciji?", "options": ["Hodočašće Kabe u bilo kojem drugom vremenu izvan vremena hadža.", "Obred koji se može obaviti samo devetog zul-hidžeta.", "Obavezni boravak na Arefatu tokom ramazana.", "Bacanje kamenčića na Mini bez tavafa."], "answer": 0}], sections=[["Šta je hadž?", "Hadž je peti islamski šart. To je ibadet posjete Kabi i drugim svetim mjestima u propisanom vremenu. Obavezan je jednom u životu muslimanima i muslimankama koji ispunjavaju uvjete."], ["Uvjeti obaveznosti", "Osoba mora biti punoljetna i fizički i mentalno zdrava, imati materijalne mogućnosti za put i povratak uz osiguranu opskrbu porodice te siguran put. Lekcija navodi prisustvo mahrema kao dodatni uvjet za ženu."], ["Ihram i telbijja", "Na mikatima u blizini Mekke hadžije oblače ihrame. Muškarci nose dva bijela nešivena platna, a žene uobičajenu nošnju – hidžab. Lijepo je okupati se i namirisati prije oblačenja. Zatim se klanjaju dva rekata i uči telbijja."], ["Zabrane u ihramu", "Muhrimima su zabranjeni spolni odnosi, bestidne riječi, svađe, lov i ubijanje insekata, mirisanje, rezanje noktiju, brijanje i šišanje, mirisni sapuni i šamponi. Muškarcima je zabranjeno pokrivanje glave, a ženama lica; ženama koje nisu u ihramu zabranjuje se oblačenje bilo kakve šivene odjeće u opisu lekcije."], ["Arefat i Muzdelifa", "Devetog zul-hidžeta hadžije borave na Arefatu. Podne i ikindiju klanjaju spojeno u podnevskom vremenu. Nakon zalaska Sunca odlaze na Muzdelifu, gdje spajaju akšam i jaciju i sakupljaju kamenčiće."], ["Mina, tavaf i sa’j", "Desetog zul-hidžeta nakon sabaha hadžije odlaze na Veliko džemre i bacaju kamenčiće. U Mekki obavljaju tavaf – sedam obilazaka oko Kabe, počevši od Hadžerul-esveda – zatim klanjaju dva rekata iza Mekami-Ibrahima i obavljaju sa’j između Safe i Merve."], ["Završetak hadža", "Poslije tavafa i sa’ja skidaju se ihrami i prestaju zabrane. U danima tešrika bacaju se kamenčići na ostalim džemretima. Prije povratka obavlja se oproštajni tavaf."], ["Umra", "Umra je hodočašće Kabe izvan vremena hadža. Sastoji se od ihrama, tavafa i sa’ja. Posebno je vrijedna u ramazanu."]];
const $=id=>document.getElementById(id);let card=0,turned=false,qi=0,points=0,lock=false,pick=null,matched=0,memFirst=null,memLock=false,memMatched=0;
function beep(ok){try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=ok?740:240;o.connect(g);g.connect(a.destination);g.gain.value=.06;o.start();o.stop(a.currentTime+.13)}catch(e){}}
function full(){document.documentElement.requestFullscreen?.().catch(()=>{})}
function show(id){for(let s of document.querySelectorAll('main section'))s.classList.toggle('hide',s.id!==id);window.scrollTo(0,0);if(id==='cards')renderCard()}
$('lesson').innerHTML=sections.map(([h,t])=>`<article class="card"><h2>${h}</h2><p>${t}</p></article>`).join('');
function renderCard(){$('cardCount').textContent=`Kartica ${card+1} / ${data.length}`;$('flash').textContent=turned?data[card].options[0]:data[card].q}function flip(){turned=!turned;renderCard()}function nextCard(){card=(card+1)%data.length;turned=false;renderCard()}function prevCard(){card=(card+data.length-1)%data.length;turned=false;renderCard()}
function startQuiz(){qi=0;points=0;show('quiz');renderQuiz()}function renderQuiz(){lock=false;if(qi===data.length){$('progress').textContent='Kviz završen';$('question').textContent=`Rezultat: ${points} bodova`;$('answers').innerHTML='<button onclick="startQuiz()">Ponovi kviz</button>';$('score').textContent='';return}let d=data[qi];$('progress').textContent=`Pitanje ${qi+1} / ${data.length}`;$('question').textContent=d.q;$('score').textContent=`Bodovi: ${points}`;let order=[0,1,2,3].sort(()=>Math.random()-.5);$('answers').innerHTML='';order.forEach(i=>{let b=document.createElement('button');b.className='option';b.textContent=d.options[i];b.onclick=()=>{if(lock)return;lock=true;let ok=i===0;points+=ok?10:-3;beep(ok);b.classList.add(ok?'good':'bad');[...$('answers').children].forEach(x=>x.disabled=true);setTimeout(()=>{qi++;renderQuiz()},850)};$('answers').appendChild(b)})}
function sample(){return [...data.keys()].sort(()=>Math.random()-.5).slice(0,6)}
function startPairs(){show('pairs');matched=0;pick=null;let ids=sample(),items=ids.flatMap(i=>[{i,kind:'q',txt:data[i].q},{i,kind:'a',txt:data[i].options[0]}]).sort(()=>Math.random()-.5);$('pairArea').innerHTML='';$('pairStatus').textContent='Spojeno: 0 / 6';items.forEach(it=>{let b=document.createElement('button');b.className='tile';b.textContent=it.txt;b.onclick=()=>{if(b.classList.contains('done'))return;if(!pick){pick={it,b};b.classList.add('sel');return}if(pick.b===b){b.classList.remove('sel');pick=null;return}if(pick.it.i===it.i&&pick.it.kind!==it.kind){b.classList.add('done');pick.b.classList.remove('sel');pick.b.classList.add('done');matched++;beep(true);$('pairStatus').textContent=`Spojeno: ${matched} / 6${matched===6?' – Bravo!':''}`}else{pick.b.classList.remove('sel');beep(false)}pick=null};$('pairArea').appendChild(b)})}
function startMemory(){show('memory');memFirst=null;memLock=false;memMatched=0;let ids=sample(),items=ids.flatMap(i=>[{i,kind:'q',txt:data[i].q},{i,kind:'a',txt:data[i].options[0]}]).sort(()=>Math.random()-.5);$('memoryArea').innerHTML='';$('memoryStatus').textContent='Parovi: 0 / 6';items.forEach((it,j)=>{let b=document.createElement('button');b.textContent=j+1;b.onclick=()=>{if(memLock||b.classList.contains('done')||b.classList.contains('open'))return;b.classList.add('open');b.textContent=it.txt;if(!memFirst){memFirst={it,b,j};return}let prev=memFirst;memFirst=null;if(prev.it.i===it.i&&prev.it.kind!==it.kind){b.classList.add('done');prev.b.classList.add('done');memMatched++;beep(true);$('memoryStatus').textContent=`Parovi: ${memMatched} / 6${memMatched===6?' – Bravo!':''}`}else{memLock=true;beep(false);setTimeout(()=>{b.classList.remove('open');prev.b.classList.remove('open');b.textContent=j+1;prev.b.textContent=prev.j+1;memLock=false},1100)}};$('memoryArea').appendChild(b)})}
show('lesson');
